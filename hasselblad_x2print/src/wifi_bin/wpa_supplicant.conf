# wpa_supplicant.conf — Deployment template for X2D II camera STA to join a printer hotspot
# deploy_and_join.sh substitutes {{SSID}}/{{PSK}} with the provided values and pushes the file
# to /data/x2print/wifi/wpa_supplicant.conf on the camera; this file is not deployed directly.
#
# Camera-side facts (NOTES §14): bcmdhd is built for IAPSTA; after manual insmod, wlan0 is
# already registered with cfg80211. `wl join` is pruned by firmware (WLC_E_PRUNE reason 1),
# so use the standard
# supplicant + nl80211。

# ctrl interface: /tmp (wpas directory) is writable on the camera; wpa_cli -p /tmp/wpas communicates with it
ctrl_interface=/tmp/wpas

# STA actively scans and lets supplicant select a network (printer hotspot is broadcasting;
# ap_scan=2 is unnecessary)
ap_scan=1

network={
    ssid="{{SSID}}"
    psk="{{PSK}}"

    # Tested with the Mi Home Printer 1S hotspot: WPA2-PSK/CCMP; narrowing pairwise/group
    # can shorten negotiation. Allow group=CCMP TKIP if a mixed TKIP network is encountered.
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
    group=CCMP

    # Hotspot is fixed to channel 1 (2412MHz). Restricting scan frequency can significantly
    # speed up association; comment out this line in environments using another channel.
    scan_freq=2412

    # Give this network high priority (defensive; currently this is the only network block)
    priority=10
}
