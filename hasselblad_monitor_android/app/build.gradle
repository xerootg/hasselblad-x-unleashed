plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.x2dii.uvcmonitor'
    compileSdk 37

    defaultConfig {
        applicationId 'com.x2dii.uvcmonitor'
        minSdk 29
        // The UVC library's register() (2020 code) uses a PendingIntent with flags=0 + two-argument registerReceiver:
        // Android12+ requires a mutability flag for the former, Android14+ an export flag for the latter, both gated by targetSdk.
        // Lowering to 30 bypasses both requirements (sideloading is unrestricted); USB host behavior is independent of targetSdk.
        targetSdk 30
        versionCode 8
        versionName '2.7'
        testInstrumentationRunner 'com.x2dii.uvcmonitor.LifecycleInstrumentation'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
    packaging {
        jniLibs {
            // Local libuvc fixes SS isochronous budgets; verify the APK hash after packaging.
            pickFirsts += ['lib/arm64-v8a/libuvc.so', 'lib/arm64-v8a/libusb100.so', 'lib/arm64-v8a/libUVCCamera.so']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // UVC engine (libusb + libuvc, NV21 frame callbacks).
    // The transitive dependency com.serenegiant:common is unavailable (already excluded); the two required utility classes
    // are provided under the same package name in app/src/main/java/com/serenegiant/utils/.
    implementation('com.github.jiangdongguo:AndroidUSBCamera:2.2.8') {
        exclude group: 'com.serenegiant', module: 'common'
        exclude group: 'com.android.support'
    }

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
}
